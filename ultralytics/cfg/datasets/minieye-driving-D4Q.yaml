# COCO8 dataset (first 8 images from COCO train2017) by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/detect/coco8/
# Example usage: yolo train data=coco8.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco8 ← downloads here (1 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# path: /mnt/mono3d/ydong_data/Detection/2Ddetection # dataset root dir
# train: images/train # train images (relative to 'path') 4 images
# val: images/val # val images (relative to 'path') 4 images
# test: # test images (optional)

path: /deeplearning_team/ydong/dongying/projects/monocular_3d_object_detection/ultralytics/train_data/D4Q # dataset root dir
train: train_all.txt #train_20251114_195583.txt # train images (relative to 'path') 4 images
val: val_20251114_21732.txt # val images (relative to 'path') 4 images
test: # test images (optional)

# Classes
names:
  0: car
  1: tinycar
  2: bus
  3: van
  4: truck
  5: tanker
  6: large_truck
  7: construction_vehicle
  8: special_vehicle
  9: unknown
  10: pedestrian
  11: bicycle
  12: bicyclist
  13: motorcycle
  14: motorcyclist
  15: tricycle
  16: tricyclist
  17: traffic_light_bbox
  18: traffic_light_bulb
  19: traffic_sign
  20: animal
  21: movable_object
  22: warning_triangle
  23: traffic_cone
  24: water_barrier
  25: crash_barrel
  26: movable_barrier
  27: bollard
  28: sphere_bollard
  29: cube_bollard
  30: cylinder_bollard
  31: construction_barrier
  32: other_barrier
  33: road_barrier_unknown
  34: wheel
  35: plate
  36: face

# Download script/URL (optional)
# download: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco8.zip

enable_3d: True  # enable 3D labels

# roi: [0, 160, 3840, 1696]  # region of interest [x_min, y_min, x_max, y_max]

# # 新字段：统一裁剪后 resize 的输出尺寸 (W, H)，用于保证进入模型前尺寸一致
# output_shape: [960, 384]

# # 新字段：ROI 策略（可选）
# # 支持三种类型：
# # - static: 固定 ROI（与上面的 roi 等价，但更明确）
# # - random_window: 随机窗口裁剪，支持分辨率规则表 + 兜底长宽比
# # - mixed: 混合策略（如 4K 用固定 ROI，其它分辨率按随机窗口）
# roi_policy:
#   type: mixed
#   static:  # 指定某些原图分辨率用固定 ROI
#     "3840x2160": [0, 160, 3840, 1696]
#   random:   # 其它分辨率使用的随机窗口策略
#     type: random_window
#     aspect_ratio: 2.5          # 兜底长宽比（W/H）
#     seed: 42                   # 可复现实验
#     prefer_full_width: false   # 优先用全宽，否则按比例自适应
#     rules:                     # 某些分辨率的明确裁剪窗口尺寸 (cropW, cropH)
#       "1280x720": [960, 384]
#       "1920x1080": [1920, 768]

# train full image
roi_configs:
  # ------------------- 配置 1: 广角 ROI (Wide-Angle) -------------------
  # 目标: 覆盖更广的场景，保留上下文信息。
  - name: "Wide_ROI"
    # 裁剪后统一 resize 到的输出尺寸 (W, H)，这个尺寸必须与训练命令的 imgsz 匹配
    output_shape: [960, 384]
    
    # ROI 策略：
    roi_policy:
      type: mixed  # 混合策略，根据原图分辨率选择不同规则
      static:  # 针对特定分辨率使用固定裁剪
        # 对于 4K 图像，使用一个较大的中心裁剪框
        "3840x2160": [0, 160, 3840, 1696]  # 3840x1536 裁剪框 [x1, y1, x2, y2]
      random:   # 其他分辨率使用随机窗口裁剪
        type: random_window
        aspect_ratio: 2.5          # 随机裁剪时维持的宽高比 (W/H)
        seed: 42                   # 随机种子，保证可复现
        prefer_full_width: false   # 是否优先使用全宽
        rules:                     # 为其他常见分辨率指定裁剪窗口尺寸 (cropW, cropH)
          "1920x1080": [1920, 768] # e.g., 从1080p图中随机裁剪1920x768
          "1280x720": [960, 384]   # e.g., 从720p图中随机裁剪960x384

