# COCO8 dataset (first 8 images from COCO train2017) by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/detect/coco8/
# Example usage: yolo train data=coco8.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco8 ← downloads here (1 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# path: /mnt/mono3d/ydong_data/Detection/2Ddetection # dataset root dir
# train: images/train # train images (relative to 'path') 4 images
# val: images/val # val images (relative to 'path') 4 images
# test: # test images (optional)

path: /deeplearning_team/ydong/dongying/projects/monocular_3d_object_detection/ultralytics/train_data # dataset root dir
train: val.txt # train images (relative to 'path') 4 images
val: val.txt # val images (relative to 'path') 4 images
test: # test images (optional)

# Classes
names:
  0: vehicle
  1: pedestrian
  2: bicycle
  3: rider
  4: roadblock
  5: head
  6: tsr
  7: guideboard
  8: plate
  9: wheel
  10: tl_border
  11: tl_wick
  12: tl_num
  13: sanlunche
  14: jiaoyunche

# Download script/URL (optional)
# download: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco8.zip

enable_3d: True  # enable 3D labels