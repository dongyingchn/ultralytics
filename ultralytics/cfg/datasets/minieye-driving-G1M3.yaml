# Download script/URL (optional)
# download: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco8.zip

enable_3d: True  # enable 3D labels

# 方式2：resize后过滤（基于绝对像素，相对resize后的图像）
min_bbox_width_px: 8.0     # 过滤宽度<8像素的目标
min_bbox_height_px: 8.0    # 过滤高度<8像素的目标
min_bbox_area_px: 0.0     # 过滤面积<25像素²的目标

# train full image
roi_configs:
  # ------------------- 配置 1: 广角 ROI (Wide-Angle) -------------------
  # 目标: 覆盖更广的场景，保留上下文信息。
  - name: "Wide_ROI"
    # 裁剪后统一 resize 到的输出尺寸 (W, H)，这个尺寸必须与训练命令的 imgsz 匹配
    output_shape: [704, 352]
    
    # ROI 策略：
    roi_policy:
      type: mixed  # 混合策略，根据原图分辨率选择不同规则
      static:  # 针对特定分辨率使用固定裁剪
        # 对于 4K 图像，使用一个较大的中心裁剪框
        "3840x2160": [0, 100, 3840, 2020]  # 3840x1536 裁剪框 [x1, y1, x2, y2]
      random:   # 其他分辨率使用随机窗口裁剪
        type: random_window
        aspect_ratio: 2.5          # 随机裁剪时维持的宽高比 (W/H)
        seed: 42                   # 随机种子，保证可复现
        prefer_full_width: false   # 是否优先使用全宽
        rules:                     # 为其他常见分辨率指定裁剪窗口尺寸 (cropW, cropH)
          "1920x1080": [1920, 960] # e.g., 从1080p图中随机裁剪1920x768
          "1280x720": [704, 352]   # e.g., 从720p图中随机裁剪960x384